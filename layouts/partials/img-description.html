<div class="img-description img-description--card rich-text">

  <div class="img-hover-border">
    <div>
      <img src="{{.Params.thumbnail}}" class="img-fluid" alt="{{ .Params.thumbnailAlt | default .Title }}" loading="lazy" decoding="async">
    </div>
  </div>

  {{ if .Title }}
  <a href="{{ .Permalink }}" class="heading-4 img-description__link">{{ .Title }}</a>
  {{ end }}

  {{ if .Params.Summary }}
  <p>{{ .Params.Summary }}</p>
  {{ end }}

  <span class="category-title" aria-hidden="true">{{ i18n "knowMore" }} +</span>
</div>
