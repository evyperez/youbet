{{ $data := index .Site.Data .Site.Language.Lang }}
{{ with $data.benefits }}
<section class="benefits">
  <div class="container">
    <header class="benefits__header">
      {{ with .eyebrow }}<p class="benefits__eyebrow">{{ . }}</p>{{ end }}
      {{ with .title }}<h2 class="benefits__title">{{ . }}</h2>{{ end }}
    </header>
    <ul class="benefits__list">
      {{ range .list }}
      <li class="polaroid">
        {{ if .photo }}
        <picture class="polaroid__photo">
          <source type="image/webp" media="(min-width: 600px)" srcset="/uploads/images/{{ .photo }}--900.webp">
          <source type="image/webp" srcset="/uploads/images/{{ .photo }}--500.webp">
          <img src="/uploads/images/{{ .photo }}.jpg" alt="{{ .alt }}" width="900" height="763" loading="lazy" decoding="async">
        </picture>
        {{ end }}
        <h3 class="polaroid__title">{{ .title }}</h3>
        <p class="polaroid__text">{{ .text }}</p>
      </li>
      {{ end }}
    </ul>
  </div>
</section>
{{ end }}
