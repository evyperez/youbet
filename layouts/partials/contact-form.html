{{ if .Params.form }}
<article class="contact-form">
  <div class="container container--narrow ">
    <div class="rich-text contact-form__intro">
      <h2 class="title-section">{{ i18n "getAQuote" }}</h2>
      {{ $emailLink := `<a href="mailto:contato@youbetschool.com">contato@youbetschool.com</a>` }}
      {{ $whatsappLink := `<a href="https://wa.me/5511987366608" target="_blank" rel="noopener">+55 11 98736-6608</a>` }}
      <p>{{ printf (i18n "contactAlternatives") $emailLink $whatsappLink | safeHTML }}</p>
    </div>
    <form id="contato" name="contact" method="POST" data-netlify="true" action="{{ with .Site.GetPage "contact/success"
      }}{{ .Permalink }}{{ else }}/contato/sucesso/{{ end }}">
      <input type="hidden" name="form-name" value="contact" />
      <p hidden aria-hidden="true">
        <label for="contact-bot">Não preencha: <input id="contact-bot" name="bot-field" tabindex="-1"
            autocomplete="off" /></label>
      </p>
      <div class="form-wrap">
        <div class="two-columns">
          <div class="form-group ">
            <label for="firstName">
              {{ i18n "firstName" | title }} <span class="required">*</span>
            </label>
            <input type="text" id="firstName" name="firstName" required />
          </div>
          <div class="form-group ">
            <label for="lastName">
              {{ i18n "lastName" | title }} <span class="required">*</span>
            </label>
            <input type="text" id="lastName" name="lastName" required />
          </div>
        </div>
        <div class="two-columns">
          <div class="form-group">
            <label for="phone">
              {{ i18n "phone" | title }}
            </label>
            <input type="text" id="phone" name="phone" />
          </div>
          <div class="form-group">
            <label for="whatsapp">
              {{ i18n "whatsApp" | title }}
            </label>
            <input type="text" id="whatsapp" name="whatsapp" />
          </div>
        </div>
        <div class="form-group">
          <label for="email">
            {{ i18n "email" | title }} <span class="required">*</span>
          </label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-group">
          <label for="subject">
            {{ i18n "subject" | title }} <span class="required">*</span>
          </label>
          <input type="text" value="{{.Params.form}}" id="subject" name="subject" required />
        </div>
        <div class="form-group" hidden>
          <label for="page">
            {{ i18n "page" | title }} <span class="required">*</span>
          </label>
          <input type="hidden" value="{{.Params.form}}" name="page" value="{{.Params.form}}">
        </div>
        <div class="form-group">
          <label for="message">
            {{ i18n "message" | title }} <span class="required">*</span>
          </label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <div class="button-wrap button-wrap--center">
          <button type="submit" class="button-secondary button-secondary--solid">{{ i18n "send" }}</button>
        </div>
      </div>

    </form>
  </div>
</article>
{{end}}
