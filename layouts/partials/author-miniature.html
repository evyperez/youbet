{{- range .Params.authors }}

{{- with $.Site.GetPage "taxonomyTerm" (printf "authors/%s" (urlize .)) }}

<div class="author">
  <div class="avatar avatar--small">
    <a href="{{ .RelPermalink }}" tabindex="-1" aria-hidden="true"><img src="{{ .Params.avatar }}" alt="" /></a>
  </div>
  <div>
    {{if .Params.Name}}
    <p class="small"><a href="{{ .RelPermalink }}">{{ .Params.Name }}</a></p>
    {{ end }}
  </div>
</div>

{{ end }}
{{ end }}
