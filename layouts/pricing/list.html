{{ define "main" }}
<main role="main" id="conteudo" class="internal-page">

 {{partial "page-title.html" .}}


    {{ partial "breadcrumbs.html" . }}
        <section class="pricing-partial">
          <div class="container">
            <div class="price">

              <div class="form-group ">
                <label for="pricing-course">{{ i18n "que tipo de curso quer fazer" }}</label>
                <select id="pricing-course">
                  <option>
                    Ensino Médio
                  </option>
                </select>
              </div>

              <div class="form-group ">
                <label for="pricing-country">{{ i18n "country" }}</label>
                <select id="pricing-country">
                  <option>
                    {{ i18n "select" | title }}
                  </option>
                  <option value="us">
                    {{ i18n "unitedStates" | title }}
                  </option>
                  <option value="ca">
                    {{ i18n "canada" | title }}
                  </option>
                </select>
              </div>

              {{ partial "pricing.html" . }}

            </div>
          </div>
        </section>

      </main>
{{ end }}
