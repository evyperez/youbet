{{ define "main" }}
    <main role="main" id="conteudo" class="internal-page">
      <h1 class="visually-hidden">{{ .Title }}</h1>
      <div class="container">
        <div class="three-columns">

          {{ range .Data.Pages.ByDate.Reverse }}
          <div class="card">
            {{ if .Params.thumbnail }}
            <div class="card__image">
                  <img src="{{ .Params.thumbnail }}" alt="{{ .Params.Name }}" />

                {{ partial "float-avatar.html" . }}

              </div>
            {{ end }}

            <div class="card__body">



              <a href="{{ .Permalink }}" class="text-decor--none text-align--center">
                <h2 class="heading-4">
                  {{ .Params.Name }}
                </h2>
              </a>


            </div>

          </div>
          {{ end }}

        </div>

      </div>
    </main>
{{ end }}
